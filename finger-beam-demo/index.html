<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08101f">
<title>指尖光束中文挑戰</title>
<style>
:root{--bg:#08101f;--panel:rgba(8,16,34,.82);--text:#f7f9ff;--muted:#aab7d1;--accent:#68d5ff;--good:#8df4b1;--bad:#ff9f9f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text)}
#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 15%,rgba(73,125,255,.2),transparent 38%),linear-gradient(#0b1430,#070b15)}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:saturate(.9) contrast(1.02) brightness(.68)}
#shade{position:absolute;inset:0;background:radial-gradient(circle at center,transparent 30%,rgba(3,7,15,.32) 85%)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hud{position:absolute;inset:0;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));pointer-events:none}
.topbar{display:flex;justify-content:space-between;gap:10px}.pill{background:var(--panel);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);padding:9px 13px;border-radius:999px;font-weight:800;font-size:14px}
#questionWrap{margin:10px auto 0;width:min(900px,94vw);text-align:center;background:rgba(7,14,30,.84);border:1px solid rgba(255,255,255,.17);backdrop-filter:blur(12px);border-radius:20px;padding:12px 18px}
#questionNo{font-size:13px;color:var(--muted);font-weight:800}#question{font-size:clamp(21px,3.2vw,38px);line-height:1.3;font-weight:900;margin-top:4px}
#answers{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 max(14px,env(safe-area-inset-left));pointer-events:none}
.answer{min-height:118px;padding:13px;border-radius:18px;background:rgba(8,16,34,.88);border:2px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;transition:.12s}
.answer .letter{flex:0 0 44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:23px;font-weight:1000;background:rgba(255,255,255,.1)}
.answer .txt{font-size:clamp(16px,2vw,23px);line-height:1.35;font-weight:850}.answer.hover{transform:translateY(-4px) scale(1.015);border-color:var(--accent);box-shadow:0 0 0 3px rgba(104,213,255,.15),0 0 34px rgba(104,213,255,.35)}
.answer.good{border-color:var(--good);background:rgba(18,78,45,.84)}.answer.bad{border-color:var(--bad);background:rgba(90,28,40,.86)}
.charge{position:absolute;left:0;bottom:0;height:7px;width:0;background:linear-gradient(90deg,#7eeeff,#fff);box-shadow:0 0 16px rgba(126,238,255,.9)}
#hint{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);text-align:center;font-size:15px;font-weight:800;text-shadow:0 2px 9px #000}
#result{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);padding:17px 26px;border-radius:18px;background:rgba(3,8,18,.88);border:1px solid rgba(255,255,255,.2);font-size:clamp(23px,4vw,44px);font-weight:1000;text-align:center;opacity:0;transition:.15s;pointer-events:none}.show{opacity:1!important}
#controls{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(66px,calc(env(safe-area-inset-top) + 52px));display:flex;gap:7px;z-index:5}
button{border:1px solid rgba(255,255,255,.2);background:rgba(10,20,42,.9);color:#fff;border-radius:13px;padding:10px 13px;font-size:14px;font-weight:850}
#startOverlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at center,rgba(18,40,78,.78),rgba(4,8,16,.97))}
.card{width:min(620px,92vw);padding:28px;border-radius:25px;text-align:center;background:rgba(10,18,37,.95);border:1px solid rgba(255,255,255,.16);box-shadow:0 25px 80px rgba(0,0,0,.5)}.card h1{margin:0 0 10px;font-size:clamp(28px,5vw,44px)}.card p{color:#c5d0e7;line-height:1.6}.card button{margin-top:10px;font-size:18px;padding:13px 20px;background:#e9f8ff;color:#08111e}.mini{font-size:12px!important;color:#92a0bb!important}#status{font-size:13px;color:#b7c4dc;margin-top:12px;min-height:18px}
@media(max-width:850px){#answers{grid-template-columns:repeat(2,1fr)}.answer{min-height:92px}.answer .txt{font-size:17px}#hint{top:50%}}
@media(orientation:portrait) and (max-width:850px){#questionWrap{margin-top:54px}#controls{top:max(62px,calc(env(safe-area-inset-top) + 48px))}}
</style>
</head>
<body>
<div id="app">
<video id="video" playsinline muted></video><div id="shade"></div><canvas id="fx"></canvas>
<div id="hud"><div class="topbar"><div class="pill">⚡ 指尖光束中文挑戰</div><div class="pill">分數：<span id="score">0</span></div></div>
<div id="questionWrap"><div id="questionNo">第 1 題</div><div id="question">載入中……</div></div><div id="hint">伸出食指，瞄準答案卡<br>蓄力約 0.8 秒，光束會射出並打爆選項</div></div>
<div id="controls"><button id="mouseBtn">🖱 觸控測試</button><button id="restartBtn">↻ 重玩</button></div>
<div id="answers"></div><div id="result"></div>
<div id="startOverlay"><div class="card"><h1>☝️ 指尖光束選擇題</h1><p>用前置鏡頭追蹤你的食指。將指尖移向答案卡，蓄力約 <b>0.8 秒</b>，光束會由指尖射出並打爆選項。</p><button id="startBtn">開啟鏡頭開始</button><button id="touchStartBtn" style="margin-left:7px;background:rgba(255,255,255,.10);color:white">先用觸控試玩</button><div id="status"></div><p class="mini">iPad 建議使用 Safari，並允許此網站使用鏡頭。橫向畫面效果最佳。</p></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const Q=[{q:"以下哪一句運用了比喻？",o:["月亮像一個銀色的大圓盤。","小鳥在樹上唱歌。","弟弟慢慢走進課室。","今天的天氣十分炎熱。"],a:0},{q:"「一＿＿鉛筆」應填上哪個量詞？",o:["本","枝","張","件"],a:1},{q:"哪個詞語最適合形容一個常常幫助別人的人？",o:["粗心","樂於助人","膽小","懶惰"],a:1},{q:"哪一句最能表現人物「勇敢」的性格？",o:["小明看見蛋糕便笑了。","小明把書本整齊放回書架。","小明看見同學跌倒，立即跑過去扶他。","小明雖然害怕，仍走上前保護弟弟。"],a:3},{q:"以下哪個詞語表示「很快地」？",o:["迅速","安靜","整齊","美麗"],a:0}];
const video=document.querySelector("#video"),canvas=document.querySelector("#fx"),ctx=canvas.getContext("2d"),answers=document.querySelector("#answers"),qEl=document.querySelector("#question"),qNo=document.querySelector("#questionNo"),scoreEl=document.querySelector("#score"),result=document.querySelector("#result"),hint=document.querySelector("#hint"),overlay=document.querySelector("#startOverlay"),statusEl=document.querySelector("#status"),mouseBtn=document.querySelector("#mouseBtn");
let hands=null,stream=null,run=false,touchMode=false,p={x:innerWidth/2,y:innerHeight/2,visible:false},palm={x:innerWidth/2,y:innerHeight*.65},qi=0,score=0,locked=false,hover=-1,hoverStart=0,lastFrame=0,parts=[],shots=[],waves=[],firing=false;const HOLD=800;
function resize(){const d=Math.max(1,Math.min(devicePixelRatio||1,2));canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(d,0,0,d,0,0)}addEventListener("resize",resize);resize();
function render(){locked=false;firing=false;shots=[];waves=[];hover=-1;hoverStart=0;result.className="";hint.style.opacity=1;const x=Q[qi];qNo.textContent=`第 ${qi+1} / ${Q.length} 題`;qEl.textContent=x.q;answers.innerHTML="";x.o.forEach((t,i)=>{const e=document.createElement("div");e.className="answer";e.innerHTML=`<div class="letter">${String.fromCharCode(65+i)}</div><div class="txt">${t}</div><div class="charge"></div>`;answers.appendChild(e)})}
function hit(x,y){const c=[...document.querySelectorAll(".answer")];for(let i=0;i<c.length;i++){const r=c[i].getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return i}return-1}
function update(){
  if(locked||firing||!p.visible)return;
  const h=hit(p.x,p.y),cards=[...document.querySelectorAll(".answer")];
  if(h!==hover){hover=h;hoverStart=performance.now()}
  cards.forEach((e,i)=>{e.classList.toggle("hover",i===hover);e.querySelector(".charge").style.width="0"});
  if(hover>=0){
    const v=Math.min(1,(performance.now()-hoverStart)/HOLD);
    cards[hover].querySelector(".charge").style.width=(v*100)+"%";
    if(v>=1)fire(hover);
  }
}
function fire(i){
  if(firing||locked)return;
  firing=true;
  const cards=[...document.querySelectorAll(".answer")],r=cards[i].getBoundingClientRect();
  const tx=r.left+r.width/2,ty=r.top+r.height/2;
  cards.forEach(e=>{e.classList.remove("hover");e.querySelector(".charge").style.width="0"});
  shots.push({i:i,sx:p.x,sy:p.y,x:p.x,y:p.y,tx:tx,ty:ty,t:0});
  for(let n=0;n<12;n++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;parts.push({x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.7,z:2+Math.random()*3,g:true})}
}
function resolveAnswer(i,x,y){
  if(locked)return;
  locked=true;firing=false;
  const q=Q[qi],cards=[...document.querySelectorAll(".answer")];
  cards[i].classList.add("hit","exploded",i===q.a?"good":"bad");
  cards[q.a].classList.add("good");
  hint.style.opacity=0;
  burst(i===q.a,x,y);
  waves.push({x:x,y:y,r:8,l:1,g:i===q.a});
  if(i===q.a){score+=10;scoreEl.textContent=score;show("✨ 命中！答對了！")}else show("💥 打錯了！答案是 "+String.fromCharCode(65+q.a));
  setTimeout(()=>{qi++;if(qi>=Q.length){show("🏆 完成！總分 "+score+" / "+(Q.length*10));setTimeout(()=>{qi=0;score=0;scoreEl.textContent=0;render()},2400)}else render()},1550);
}
function show(t){result.textContent=t;result.className="show"}
function burst(g,x,y){
  for(let i=0;i<42;i++){const a=Math.random()*Math.PI*2,s=2.2+Math.random()*6;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,z:2+Math.random()*6,g:g})}
}
function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  if(p.visible){
    ctx.save();ctx.lineCap="round";
    const g=ctx.createLinearGradient(palm.x,palm.y,p.x,p.y);g.addColorStop(0,"rgba(70,175,255,.03)");g.addColorStop(.55,"rgba(93,216,255,.36)");g.addColorStop(1,"white");
    ctx.strokeStyle=g;ctx.shadowColor="rgba(80,215,255,.8)";ctx.shadowBlur=20;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(palm.x,palm.y);ctx.lineTo(p.x,p.y);ctx.stroke();
    ctx.shadowBlur=20;ctx.fillStyle="white";ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();
    if(hover>=0&&!locked&&!firing){const v=Math.min(1,(performance.now()-hoverStart)/HOLD);ctx.lineWidth=5;ctx.strokeStyle="#7eeeff";ctx.beginPath();ctx.arc(p.x,p.y,18,-Math.PI/2,-Math.PI/2+Math.PI*2*v);ctx.stroke();}
    ctx.restore();
  }
  for(let k=shots.length-1;k>=0;k--){
    const s=shots[k];s.t=Math.min(1,s.t+.18);s.x=s.sx+(s.tx-s.sx)*s.t;s.y=s.sy+(s.ty-s.sy)*s.t;
    ctx.save();ctx.lineCap="round";ctx.shadowColor="rgba(90,230,255,1)";ctx.shadowBlur=26;ctx.strokeStyle="rgba(120,240,255,.92)";ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(s.sx,s.sy);ctx.lineTo(s.x,s.y);ctx.stroke();
    ctx.strokeStyle="white";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.sx,s.sy);ctx.lineTo(s.x,s.y);ctx.stroke();ctx.fillStyle="white";ctx.beginPath();ctx.arc(s.x,s.y,9,0,Math.PI*2);ctx.fill();ctx.restore();
    if(s.t>=1){shots.splice(k,1);resolveAnswer(s.i,s.tx,s.ty)}
  }
  parts.forEach(x=>{x.x+=x.vx;x.y+=x.vy;x.vy+=.04;x.l-=.03;ctx.globalAlpha=Math.max(0,x.l);ctx.fillStyle=x.g?"#b4ffd2":"#ffb8b8";ctx.beginPath();ctx.arc(x.x,x.y,x.z,0,Math.PI*2);ctx.fill()});
  parts=parts.filter(x=>x.l>0);
  waves.forEach(w=>{w.r+=8;w.l-=.045;ctx.globalAlpha=Math.max(0,w.l);ctx.strokeStyle=w.g?"#8df4b1":"#ff9f9f";ctx.lineWidth=7*w.l;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);ctx.stroke()});
  waves=waves.filter(w=>w.l>0);ctx.globalAlpha=1;
  update();requestAnimationFrame(draw);
}
draw();
async function initHands(){hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.62,minTrackingConfidence:.58});hands.onResults(r=>{if(touchMode)return;if(r.multiHandLandmarks&&r.multiHandLandmarks.length){const m=r.multiHandLandmarks[0],tip=m[8],w=m[0],mid=m[9];p.x=(1-tip.x)*innerWidth;p.y=tip.y*innerHeight;p.visible=true;const x=(1-(w.x+mid.x)/2)*innerWidth,y=(w.y+mid.y)/2*innerHeight;palm.x+=(x-palm.x)*.35;palm.y+=(y-palm.y)*.35}else{p.visible=false;hover=-1}})}
async function loop(ts){if(!run||!hands)return;if(video.readyState>=2&&ts-lastFrame>48){lastFrame=ts;try{await hands.send({image:video})}catch(e){}}requestAnimationFrame(loop)}
async function start(){statusEl.textContent="正在載入鏡頭及手部追蹤……";document.querySelector("#startBtn").disabled=true;try{if(!hands)await initHands();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();run=true;overlay.style.display="none";requestAnimationFrame(loop)}catch(e){statusEl.textContent="未能開啟鏡頭。請檢查 Safari 網站鏡頭權限，或先用觸控模式試玩。";document.querySelector("#startBtn").disabled=false}}
document.querySelector("#startBtn").onclick=start;
function touchOn(){touchMode=true;mouseBtn.textContent="☝️ 返回鏡頭";p.visible=true;palm.x=innerWidth/2;palm.y=innerHeight*.72;overlay.style.display="none"}document.querySelector("#touchStartBtn").onclick=touchOn;
mouseBtn.onclick=()=>{touchMode=!touchMode;mouseBtn.textContent=touchMode?"☝️ 返回鏡頭":"🖱 觸控測試";p.visible=touchMode;if(!touchMode&&stream)p.visible=false};
addEventListener("pointermove",e=>{if(touchMode){p.x=e.clientX;p.y=e.clientY;p.visible=true}});addEventListener("touchmove",e=>{if(touchMode&&e.touches[0]){p.x=e.touches[0].clientX;p.y=e.touches[0].clientY;p.visible=true}},{passive:true});
document.querySelector("#restartBtn").onclick=()=>{qi=0;score=0;scoreEl.textContent=0;render()};render();
</script>
</body>
</html>
